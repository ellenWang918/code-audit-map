    <text x="133" y="517" font-size="15" font-weight="600" fill="#1d1d1f">Customer portal</text>
    <text x="133" y="541" font-size="12" fill="#6e6e73">Place and track orders.</text>
    <rect x="133" y="556" width="98" height="22" rx="6" fill="#fff5e6"/><text x="144" y="571" font-size="10" fill="#8d5600">1 confirmed finding</text>
