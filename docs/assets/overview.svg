    <text x="355" y="541" font-size="12" fill="#6e6e73">Coordinates the purchase.</text>
    <rect x="355" y="556" width="101" height="22" rx="6" fill="#fff0ef"/><text x="366" y="571" font-size="10" fill="#b42328">P1 · Access control</text>
    <rect x="560" y="487" width="182" height="108" rx="16" fill="#fbfbfd" stroke="#dedee4"/>
    <text x="577" y="517" font-size="15" font-weight="600" fill="#1d1d1f">Order database</text>
