    <rect x="841" y="445" width="29" height="22" rx="5" fill="#fff0ef"/><text x="849" y="460" font-size="10" font-weight="600" fill="#b42328">P1</text>
    <text x="885" y="450" font-size="13" font-weight="600" fill="#1d1d1f">Protect customer account boundaries</text>
    <text x="885" y="472" font-size="11" fill="#6e6e73">Confirmed · file and line evidence · 1–2 engineer-days</text>
    <rect x="823" y="499" width="497" height="63" rx="12" fill="#f8f9fb"/>
    <rect x="841" y="519" width="29" height="22" rx="5" fill="#fff5e6"/><text x="849" y="534" font-size="10" font-weight="600" fill="#8d5600">P1</text>
    <text x="885" y="524" font-size="13" font-weight="600" fill="#1d1d1f">Validate payment retry behavior</text>
    <text x="885" y="546" font-size="11" fill="#6e6e73">Potential risk · assumptions visible · validation first</text>
    <text x="823" y="607" font-size="14" font-weight="600" fill="#1d1d1f">A phased path forward</text>
