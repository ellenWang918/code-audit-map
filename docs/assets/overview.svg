    <text x="345" y="462" font-size="10" fill="#6e6e73" letter-spacing="1">BUSINESS OPERATIONS</text>
    <text x="568" y="462" font-size="10" fill="#6e6e73" letter-spacing="1">BUSINESS RECORDS</text>
