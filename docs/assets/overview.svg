    <text x="84" y="147" font-size="48" font-weight="650" fill="#1d1d1f" letter-spacing="-2">Understand the code.</text>
    <text x="84" y="205" font-size="48" font-weight="650" fill="#1d1d1f" letter-spacing="-2">See what matters.</text>
    <text x="84" y="249" font-size="20" fill="#6e6e73">Architecture, evidence, and a practical path forward.</text>
    <rect x="1037" y="76" width="319" height="38" rx="19" fill="#fff"/>
    <text x="1196" y="101" text-anchor="middle" font-size="13" fill="#5c6e86">READ-ONLY · OFFLINE HTML · CLEAR PRIORITIES</text>
    <g filter="url(#shadow)">
      <rect x="80" y="297" width="1280" height="447" rx="24" fill="#fff"/>
    </g>
    <path d="M80 351H1360" stroke="#e5e5ea"/>
    <circle cx="109" cy="324" r="5" fill="#d2d2d7"/><circle cx="127" cy="324" r="5" fill="#d2d2d7"/><circle cx="145" cy="324" r="5" fill="#d2d2d7"/>
    <text x="185" y="330" font-size="14" font-weight="600" fill="#1d1d1f">Northstar Orders</text>
    <text x="1187" y="330" font-size="12" fill="#6e6e73">Fictional demonstration</text>
    <text x="116" y="394" font-size="21" font-weight="600" fill="#1d1d1f">How the product works</text>
    <text x="116" y="421" font-size="13" fill="#6e6e73">Follow capabilities, not a wall of filenames.</text>
