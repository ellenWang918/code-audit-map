    <text x="116" y="675" font-size="12" fill="#0066cc">Select a capability → inspect connections → open the evidence</text>
    <path d="M785 381V704" stroke="#e5e5ea"/>
    <text x="823" y="394" font-size="21" font-weight="600" fill="#1d1d1f">Decisions, backed by evidence.</text>
