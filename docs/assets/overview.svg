<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Code Audit Map — understand the system and decide what matters</title>
  <desc id="desc">Illustrated report overview showing a business capability map, evidence-backed findings, and a phased roadmap. Fictional demonstration, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7fb"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#253d69" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#93a7c5"/></marker>
  </defs>
  <rect width="1440" height="820" rx="32" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
