<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="250" viewBox="0 0 1440 250" role="img" aria-labelledby="title desc">
  <title id="title">From repository evidence to a maintained HTML report</title>
  <desc id="desc">Five steps: understand the repository, trace capabilities, assess evidence, validate JSON, and refresh the same HTML report.</desc>
  <rect width="1440" height="250" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="44" y="43" font-size="13" font-weight="600" fill="#6e6e73" letter-spacing="1">ONE WORKFLOW. ONE MAINTAINED REPORT.</text>
    <g fill="#fff" stroke="#e5e5ea"><rect x="44" y="70" width="242" height="130" rx="18"/><rect x="321" y="70" width="242" height="130" rx="18"/><rect x="598" y="70" width="242" height="130" rx="18"/><rect x="875" y="70" width="242" height="130" rx="18"/><rect x="1152" y="70" width="242" height="130" rx="18"/></g>
    <g font-size="12" font-weight="600" fill="#0066cc"><text x="66" y="102">01 / UNDERSTAND</text><text x="343" y="102">02 / CONNECT</text><text x="620" y="102">03 / ASSESS</text><text x="897" y="102">04 / VALIDATE</text><text x="1174" y="102">05 / REFRESH</text></g>
    <g font-size="18" font-weight="600" fill="#1d1d1f"><text x="66" y="137">Read the repository</text><text x="343" y="137">Trace capabilities</text><text x="620" y="137">Prioritize the risks</text><text x="897" y="137">Check the report data</text><text x="1174" y="137">Update the same HTML</text></g>
    <g font-size="12" fill="#6e6e73"><text x="66" y="165">Inventory, boundaries, coverage.</text><text x="343" y="165">Real calls, data, events, journeys.</text><text x="620" y="165">Evidence and business impact.</text><text x="897" y="165">Stable IDs and valid references.</text><text x="1174" y="165">A local, interactive decision tool.</text></g>
    <g font-size="23" fill="#9caac0"><text x="294" y="142">›</text><text x="571" y="142">›</text><text x="848" y="142">›</text><text x="1125" y="142">›</text></g>
  </g>
</svg>
